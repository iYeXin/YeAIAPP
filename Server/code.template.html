<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证码邮件</title>
    <style>
        /* 邮件客户端兼容的内联样式为主，此处仅作后备 */
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
        }
    </style>
</head>

<body
    style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #f5f5f5; width: 100%;">
        <tr>
            <td align="center" style="padding: 40px 20px;">
                <!-- 主卡片：直角矩形，白色背景，无圆角 -->
                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="max-width: 480px; width: 100%; background-color: #ffffff; border: 1px solid #e0e0e0; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
                    <tr>
                        <td style="padding: 32px 32px 24px 32px;">
                            <!-- Logo / 品牌标识 -->
                            <div
                                style="font-size: 24px; font-weight: 600; color: #0078D4; margin-bottom: 16px; letter-spacing: -0.5px;">
                                YeXin - 应用生成
                            </div>
                            <!-- 标题 -->
                            <div style="font-size: 20px; font-weight: 500; color: #333333; margin-bottom: 24px;">
                                您的验证码
                            </div>
                            <!-- 说明文字 -->
                            <div style="font-size: 14px; color: #666666; line-height: 1.6; margin-bottom: 32px;">
                                请使用以下验证码完成登录。验证码有效期为 5 分钟，请勿泄露给他人。
                            </div>
                            <!-- 验证码卡片：浅色背景，直角边框 -->
                            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="background-color: #f0f8ff; border: 1px solid #d0e6f5; margin-bottom: 32px;">
                                <tr>
                                    <td align="center" style="padding: 24px 16px;">
                                        <span
                                            style="font-size: 40px; font-weight: 700; color: #0078D4; letter-spacing: 8px;">{{code}}</span>
                                    </td>
                                </tr>
                            </table>
                            <!-- 提示信息 -->
                            <div
                                style="font-size: 13px; color: #999999; border-top: 1px solid #eeeeee; padding-top: 24px;">
                                如果这不是您本人的操作，请忽略此邮件。
                            </div>
                        </td>
                    </tr>
                    <!-- 底部直角，无圆角 -->
                    <tr>
                        <td
                            style="background-color: #fafafa; padding: 16px 32px; border-top: 1px solid #eeeeee; font-size: 12px; color: #aaaaaa; text-align: left;">
                            © 2026 YeXin. All rights reserved.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
